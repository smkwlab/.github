# AI Review — self-caller for this (.github) repository.
#
# Runs the one-shot ai-review reusable (Claude, CODE mode) on this repo's own
# PRs. Replaces the former claude-review.yml (claude-code-action self-caller).

name: AI Review (self)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]   # synchronize: re-review on every push (matches the old ai-reviewer). Revisit if cost becomes a concern. concurrency below cancels superseded runs.

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ./.github/workflows/ai-review.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      model_code: claude-sonnet-4-6
      review_mode: CODE

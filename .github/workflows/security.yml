# Reusable Security Workflow
#
# Usage:
#   jobs:
#     security:
#       uses: smkwlab/.github/.github/workflows/security.yml@v1.1.0
#       secrets: inherit

name: Security (Reusable)

on:
  workflow_call:
    inputs:
      otp-version:
        description: 'OTP version'
        default: '29.0.2'
        required: false
        type: string
      elixir-version:
        description: 'Elixir version'
        default: '1.20.1'
        required: false
        type: string
      dependency-audit-timeout:
        description: 'Dependency audit job timeout in minutes'
        default: 15
        required: false
        type: number
      secret-scan-timeout:
        description: 'Secret scan job timeout in minutes'
        default: 10
        required: false
        type: number

permissions:
  contents: read
  actions: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    name: Dependency Security Audit
    timeout-minutes: ${{ inputs.dependency-audit-timeout }}

    steps:
    - name: Set up Git repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}

    - name: Restore dependencies cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Run dependency security audit
      run: |
        mix escript.install hex mix_audit --force
        export PATH="$HOME/.mix/escripts:$PATH"
        if ! mix_audit; then
          echo "❌ Vulnerable dependencies found!"
          exit 1
        else
          echo "✅ No vulnerable dependencies found"
        fi

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.secret-scan-timeout }}

    steps:
    - name: Set up Git repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0

    - name: Scan for secrets in codebase
      uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
      with:
        path: ./
        base: ${{ github.event.before || 'HEAD~1' }}
        head: HEAD
        extra_args: --debug --only-verified

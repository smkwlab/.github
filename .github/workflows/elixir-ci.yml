# Reusable Elixir CI Workflow
#
# Usage:
#   jobs:
#     ci:
#       uses: smkwlab/.github/.github/workflows/elixir-ci.yml@main
#
# See: https://github.com/smkwlab/tenbin_dns/issues/60

name: Elixir CI (Reusable)

on:
  workflow_call:
    inputs:
      otp-version-lts:
        description: 'LTS OTP version'
        # renovate: datasource=github-releases depName=erlang/otp-lts packageName=erlang/otp versioning=loose extractVersion=^OTP-(?<version>.*)$
        default: '27.3.4.16'
        required: false
        type: string
      elixir-version-lts:
        description: 'LTS Elixir version'
        # renovate: datasource=github-releases depName=elixir-lang/elixir-lts packageName=elixir-lang/elixir versioning=semver extractVersion=^v(?<version>.*)$
        default: '1.17.3'
        required: false
        type: string
      otp-version-latest:
        description: 'Latest OTP version'
        # renovate: datasource=github-releases depName=erlang/otp packageName=erlang/otp versioning=loose extractVersion=^OTP-(?<version>.*)$
        default: '29.0.5'
        required: false
        type: string
      elixir-version-latest:
        description: 'Latest Elixir version'
        # renovate: datasource=github-releases depName=elixir-lang/elixir packageName=elixir-lang/elixir versioning=semver extractVersion=^v(?<version>.*)$
        default: '1.20.4'
        required: false
        type: string
      dialyzer-enabled:
        description: 'Enable Dialyzer analysis'
        default: true
        required: false
        type: boolean
      timeout-minutes:
        description: 'Job timeout in minutes'
        default: 15
        required: false
        type: number
      dialyzer-timeout-minutes:
        description: 'Dialyzer job timeout in minutes'
        default: 20
        required: false
        type: number

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    name: Code Quality

    steps:
    - name: Set up Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ inputs.otp-version-latest }}
        elixir-version: ${{ inputs.elixir-version-latest }}

    - name: Restore dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Check Formatting
      run: mix format --check-formatted

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Run Credo
      run: mix credo --strict

  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    name: Test on OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    strategy:
      matrix:
        include:
          - otp: ${{ inputs.otp-version-lts }}
            elixir: ${{ inputs.elixir-version-lts }}
            primary: true
          - otp: ${{ inputs.otp-version-latest }}
            elixir: ${{ inputs.elixir-version-latest }}
            primary: false

    steps:
    - name: Set up Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Elixir
      id: beam
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ matrix.otp }}
        elixir-version: ${{ matrix.elixir }}

    - name: Restore dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    # Keyed on what setup-beam actually installed rather than on what was
    # asked for, so that a moving or range version cannot hand this run an
    # artifact another toolchain compiled. The elixir-version output carries
    # the OTP pairing too (v1.20.3-otp-29). The bare ${{ runner.os }}-build-
    # fallback is deliberately absent: it restored across toolchains.
    - name: Restore build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: _build
        key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Run tests with coverage
      run: mix test --cover

    - name: Upload coverage to Codecov
      if: matrix.primary
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        # For private repositories, set CODECOV_TOKEN secret in your repository
        # See: https://docs.codecov.com/docs/github-actions#using-private-repositories
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./cover
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: coverage-${{ matrix.otp }}-${{ matrix.elixir }}
        path: cover/
        retention-days: 7

  # One check run that stands for the whole matrix, so branch protection has a
  # single context to require. Requiring the matrix jobs directly would mean
  # editing every repository's protection each time an OTP or Elixir version
  # moves, because their names carry the versions.
  #
  # `if: always()` is what makes this work. Without it a failing dependency
  # skips this job instead of failing it, and GitHub counts a skipped required
  # check as satisfied -- the gate would go quietly green exactly when it is
  # supposed to stop the merge. The results are therefore read explicitly.
  #
  # dialyzer is left out: it only runs on push, so on a pull request it would
  # always be skipped and could never be part of a verdict.
  gate:
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    name: All checks

    steps:
    # Only `success` passes. `skipped` fails on purpose: a job that did not run
    # has certified nothing, and accepting it would reopen the hole this gate
    # exists to close -- adding an `if:` to a job above would then let it out of
    # the verdict silently. If a job ever becomes legitimately optional, decide
    # that here rather than letting the gate infer it.
    #
    # The results are echoed so the log records what the verdict was based on,
    # including on the runs that pass.
    - name: Verify that every required job succeeded
      env:
        RESULTS: ${{ needs.quality.result }} ${{ needs.test.result }}
      run: |
        echo "quality=${{ needs.quality.result }} test=${{ needs.test.result }}"
        for result in $RESULTS; do
          if [ "$result" != "success" ]; then
            echo "::error::A required job did not succeed (${RESULTS})"
            exit 1
          fi
        done

  dialyzer:
    if: ${{ inputs.dialyzer-enabled && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.dialyzer-timeout-minutes }}
    name: Dialyzer Analysis on OTP ${{ inputs.otp-version-latest }} / Elixir ${{ inputs.elixir-version-latest }}

    permissions:
      contents: read
      issues: write

    steps:
    - name: Set up Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Elixir
      id: beam
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ inputs.otp-version-latest }}
        elixir-version: ${{ inputs.elixir-version-latest }}

    - name: Restore dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    # A PLT contains OTP's own modules, so one built against a different OTP
    # makes Dialyzer report failures and successes that are both meaningless --
    # and a failure here opens an issue. Key on the installed toolchain and
    # drop the bare ${{ runner.os }}-plt- fallback, which crossed toolchains.
    - name: Restore PLT cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: plt_cache
      with:
        path: priv/plts
        key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    - name: Create PLTs
      if: steps.plt_cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p priv/plts
        mix dialyzer --plt

    - name: Run Dialyzer with output capture
      id: dialyzer
      run: |
        echo "Running Dialyzer analysis..."
        if mix dialyzer --format dialyxir > dialyzer_output.txt 2>&1; then
          echo "result=success" >> "$GITHUB_OUTPUT"
          echo "Dialyzer completed successfully"
        else
          echo "result=failure" >> "$GITHUB_OUTPUT"
          echo "Dialyzer found issues"
        fi
        echo "output_file=dialyzer_output.txt" >> "$GITHUB_OUTPUT"
      continue-on-error: true

    - name: Read Dialyzer output
      id: read_output
      if: always()
      run: |
        if [ -f dialyzer_output.txt ]; then
          echo "Reading Dialyzer output..."
          DIALYZER_OUTPUT=$(cat dialyzer_output.txt)
          {
            echo "dialyzer_output<<EOF"
            echo "$DIALYZER_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "dialyzer_output=No Dialyzer output file found" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Issue for Dialyzer failures
      if: steps.dialyzer.outputs.result == 'failure'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DIALYZER_OUTPUT: ${{ steps.read_output.outputs.dialyzer_output }}
      with:
        script: |
          const dialyzerOutput = process.env.DIALYZER_OUTPUT;

          const issueTitle = `Dialyzer warnings/errors in main branch (${context.sha.substring(0, 7)})`;
          const issueBody = [
            '## Dialyzer Analysis Results',
            '',
            `**Commit:** ${context.sha}`,
            `**Branch:** ${context.ref}`,
            `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            `**OTP/Elixir:** ${{ inputs.otp-version-latest }}/${{ inputs.elixir-version-latest }}`,
            '',
            '### Output:',
            '```',
            dialyzerOutput,
            '```',
            '',
            'Please review and fix these Dialyzer warnings/errors.',
            '',
            '---',
            '*This issue was automatically created by the Elixir CI workflow.*'
          ].join('\n');

          // Check if there's already an open issue for Dialyzer
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'dialyzer,automated'
          });

          const existingIssue = issues.data.find(issue =>
            issue.title.includes('Dialyzer warnings/errors in main branch')
          );

          if (existingIssue) {
            // Update existing issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              body: [
                '## New Dialyzer Issues Found',
                '',
                `**Commit:** ${context.sha}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**OTP/Elixir:** ${{ inputs.otp-version-latest }}/${{ inputs.elixir-version-latest }}`,
                '',
                '### Output:',
                '```',
                dialyzerOutput,
                '```'
              ].join('\n')
            });
          } else {
            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['dialyzer', 'automated']
            });
          }

    - name: Close Dialyzer issues on success
      if: steps.dialyzer.outputs.result == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          // Close any existing Dialyzer issues if analysis passed
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'dialyzer,automated'
          });

          for (const issue of issues.data) {
            if (issue.title.includes('Dialyzer warnings/errors in main branch')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Dialyzer analysis passed successfully in commit ${context.sha.substring(0, 7)} (OTP ${{ inputs.otp-version-latest }}/Elixir ${{ inputs.elixir-version-latest }}). Closing this issue.`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
          }

---
# Reusable Workflow: Create Next Draft Branch
#
# This workflow automatically creates the next draft branch when a PR is opened.
# Use this from other repositories with:
#
#   jobs:
#     create-next:
#       uses: smkwlab/.github/.github/workflows/create-next-draft.yml@v1
#
name: Create Next Draft Branch

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-next-branch:
    runs-on: ubuntu-latest

    # Only run for draft or abstract branch PRs
    if: |
      contains(github.head_ref, 'draft') ||
      contains(github.head_ref, 'abstract-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next branch name
        id: next-branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          CURRENT_BRANCH="$HEAD_REF"

          # Pattern matching to determine next branch name
          if [[ "$CURRENT_BRANCH" =~ ^([0-9]+)(st|nd|rd|th)-draft$ ]]; then
            # Main thesis branch (e.g., 1st-draft, 2nd-draft, etc.)
            CURRENT_NUM="${BASH_REMATCH[1]}"
            NEXT_NUM=$((CURRENT_NUM + 1))

            # Determine ordinal suffix
            LAST_TWO=$((NEXT_NUM % 100))
            LAST_ONE=$((NEXT_NUM % 10))
            if [[ $LAST_TWO -ge 11 && $LAST_TWO -le 13 ]]; then
              SUFFIX="th"
            elif [[ $LAST_ONE -eq 1 ]]; then
              SUFFIX="st"
            elif [[ $LAST_ONE -eq 2 ]]; then
              SUFFIX="nd"
            elif [[ $LAST_ONE -eq 3 ]]; then
              SUFFIX="rd"
            else
              SUFFIX="th"
            fi

            NEXT_BRANCH="${NEXT_NUM}${SUFFIX}-draft"

          elif [[ "$CURRENT_BRANCH" =~ ^abstract-([0-9]+)(st|nd|rd|th)$ ]]; then
            # Abstract branch (e.g., abstract-1st, abstract-2nd, etc.)
            CURRENT_NUM="${BASH_REMATCH[1]}"
            NEXT_NUM=$((CURRENT_NUM + 1))

            # Determine ordinal suffix
            LAST_TWO=$((NEXT_NUM % 100))
            LAST_ONE=$((NEXT_NUM % 10))
            if [[ $LAST_TWO -ge 11 && $LAST_TWO -le 13 ]]; then
              SUFFIX="th"
            elif [[ $LAST_ONE -eq 1 ]]; then
              SUFFIX="st"
            elif [[ $LAST_ONE -eq 2 ]]; then
              SUFFIX="nd"
            elif [[ $LAST_ONE -eq 3 ]]; then
              SUFFIX="rd"
            else
              SUFFIX="th"
            fi

            NEXT_BRANCH="abstract-${NEXT_NUM}${SUFFIX}"

          elif [ "$CURRENT_BRANCH" = "0th-draft" ]; then
            # Special case: 0th-draft → 1st-draft
            NEXT_BRANCH="1st-draft"

          else
            echo "Unexpected branch name pattern: $CURRENT_BRANCH"
            exit 0
          fi

          echo "next_branch=$NEXT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "current_branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check if next branch already exists
        id: check-branch
        run: |
          NEXT_BRANCH="${{ steps.next-branch.outputs.next_branch }}"

          if [ -z "$NEXT_BRANCH" ]; then
            echo "exists=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/remotes/origin/$NEXT_BRANCH"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create next draft branch
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          CURRENT_BRANCH="${{ steps.next-branch.outputs.current_branch }}"
          NEXT_BRANCH="${{ steps.next-branch.outputs.next_branch }}"

          # All branches are created based on the current branch
          BASE_BRANCH="origin/$CURRENT_BRANCH"

          # Create branch
          git checkout -b "$NEXT_BRANCH" "$BASE_BRANCH"
          git push -u origin "$NEXT_BRANCH"

          echo "Created $NEXT_BRANCH based on $CURRENT_BRANCH"

      # The student reads this when the next draft branch is not in their
      # checkout yet, so saying it exists is not enough: give the operation
      # that brings it in, and what happens if they keep writing on the
      # branch they are on. Both cases (created, already there) differ only
      # in the first line, so they share one body -- two copies of the same
      # Japanese text would get fixed one at a time (#262).
      - name: Add comment to PR
        if: steps.check-branch.outputs.exists != 'skip'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_BRANCH: ${{ steps.next-branch.outputs.current_branch }}
          NEXT_BRANCH: ${{ steps.next-branch.outputs.next_branch }}
          BRANCH_EXISTED: ${{ steps.check-branch.outputs.exists }}
        run: |
          set -eu

          if [ "$BRANCH_EXISTED" = true ]; then
            heading="次の稿を書くブランチ \`${NEXT_BRANCH}\` は既にあります。"
          else
            heading="次の稿を書くブランチ \`${NEXT_BRANCH}\` を作成しました。"
          fi

          # ${var} でなく $var と書くと、UTF-8 ロケールの bash が直後の多バイト
          # 文字の 1 バイト目を変数名に取り込み、unbound variable で本文が空に
          # なることがある
          body=$(cat <<EOF
          ${heading}

          手元に取り込むには、GitHub Desktop で次の操作をします。

          1. \`Fetch origin\` をクリック
          2. \`Current Branch\` をクリックし、\`origin/${NEXT_BRANCH}\` を選んで \`Create branch\`

          **この PR の添削対応は \`${CURRENT_BRANCH}\` で、次の稿の執筆は \`${NEXT_BRANCH}\` で行います。** 切り替えずに書き続けると、次の稿の内容がこの PR の差分に入ります。

          操作手順の詳細: [GITHUB-DESKTOP-GUIDE.md](https://github.com/smkwlab/latex-ecosystem/blob/main/docs/GITHUB-DESKTOP-GUIDE.md)
          EOF
          )

          gh pr comment "$PR_NUMBER" --body "$body"

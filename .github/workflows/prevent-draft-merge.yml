# Reusable Workflow: Prevent Draft Branch Merge
#
# This workflow prevents accidental merging of draft branches.
# Use this from other repositories with:
#
#   jobs:
#     prevent-merge:
#       uses: smkwlab/.github/.github/workflows/prevent-draft-merge.yml@v1
#
name: Prevent Draft Merge

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-draft-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip if propagate-workflow merge
        id: skip-check
        run: |
          # Get the latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "::debug::Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -q "to reconcile workflow history"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping - propagate-workflow merge detected"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if branch is draft
        if: steps.skip-check.outputs.skip != 'true'
        id: check-draft
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e

          BRANCH_NAME="$HEAD_REF"
          echo "::debug::Branch name: $BRANCH_NAME"

          # Git repository status check
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::Git repository not found"
            exit 1
          fi

          # Check for final-* tags
          echo "::debug::Checking for final-* tags..."
          TAGS_AT_HEAD=""
          if TAGS_AT_HEAD=$(git tag --points-at HEAD 2>/dev/null); then
            if echo "$TAGS_AT_HEAD" | grep -q "^final-"; then
              FINAL_TAG=$(echo "$TAGS_AT_HEAD" | grep "^final-" | head -1)
              {
                echo "is_draft=false"
                echo "is_final_submission=true"
                echo "final_tag=$FINAL_TAG"
              } >> "$GITHUB_OUTPUT"
              echo "Final submission detected - merge allowed"
              echo "::notice::Final submission tag: $FINAL_TAG"
              exit 0
            fi
          fi

          # Allow draft-to-draft sync PRs created by sync-next-draft.yml:
          # the base must be exactly the NEXT draft of the head branch
          # (e.g. head 1st-draft -> base 2nd-draft). Review PRs go in the
          # opposite direction (e.g. head 2nd-draft -> base 1st-draft)
          # and stay blocked.
          echo "::debug::Base branch: $BASE_REF"
          ordinal() {
            local n="$1" last_two last_one
            last_two=$((n % 100)); last_one=$((n % 10))
            if [[ $last_two -ge 11 && $last_two -le 13 ]]; then echo "${n}th"
            elif [[ $last_one -eq 1 ]]; then echo "${n}st"
            elif [[ $last_one -eq 2 ]]; then echo "${n}nd"
            elif [[ $last_one -eq 3 ]]; then echo "${n}rd"
            else echo "${n}th"; fi
          }
          NEXT_OF_HEAD=""
          if [[ "$BRANCH_NAME" =~ ^([0-9]+)(st|nd|rd|th)-draft$ ]]; then
            NEXT_OF_HEAD="$(ordinal $((BASH_REMATCH[1] + 1)))-draft"
          elif [[ "$BRANCH_NAME" =~ ^abstract-([0-9]+)(st|nd|rd|th)$ ]]; then
            NEXT_OF_HEAD="abstract-$(ordinal $((BASH_REMATCH[1] + 1)))"
          fi
          if [ -n "$NEXT_OF_HEAD" ] && [ "$BASE_REF" = "$NEXT_OF_HEAD" ]; then
            { echo "is_draft=false"; echo "draft_type=sync"; } >> "$GITHUB_OUTPUT"
            echo "Draft-to-draft sync PR - merge allowed"
            echo "::notice::Base ($BASE_REF) is the next draft of head ($BRANCH_NAME) - sync PR"
            exit 0
          fi

          # Branch name validation
          if [[ -z "$BRANCH_NAME" ]]; then
            echo "::error::Branch name is empty"
            exit 1
          fi

          # Check draft branch patterns
          echo "::debug::Checking draft branch patterns..."

          # Main draft branches (1st-draft, 2nd-draft, etc.)
          if [[ "$BRANCH_NAME" =~ ^[0-9]+(st|nd|rd|th)-draft$ ]]; then
            { echo "is_draft=true"; echo "draft_type=main"; } >> "$GITHUB_OUTPUT"
          # Abstract draft branches (abstract-1st, abstract-2nd, etc.)
          elif [[ "$BRANCH_NAME" =~ ^abstract-[0-9]+(st|nd|rd|th)$ ]]; then
            { echo "is_draft=true"; echo "draft_type=abstract"; } >> "$GITHUB_OUTPUT"
          # Initial submission branch (0th-draft)
          elif [[ "$BRANCH_NAME" =~ ^0th-draft$ ]]; then
            { echo "is_draft=true"; echo "draft_type=initial"; } >> "$GITHUB_OUTPUT"
          # Regular branches
          else
            { echo "is_draft=false"; echo "draft_type=none"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Block draft branch merge
        if: steps.skip-check.outputs.skip != 'true' && steps.check-draft.outputs.is_draft == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH_NAME="$HEAD_REF"

          echo "::error::Draft branch merge is not allowed"
          echo "::error::Branch name: $BRANCH_NAME"
          echo "::error::This PR is for faculty review"

          # GitHub Summary for students
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## This is a Review PR

          This PR is for **faculty review**.

          **For Students**
          - This "failure" is expected behavior (not an error)
          - Please wait for faculty review
          - Close the PR after addressing review comments
          - Continue work on the next branch

          **Purpose**
          - Prevents accidental merges
          - Ensures proper review workflow
          EOF

          exit 1

      - name: Success - Non-draft branch
        if: steps.skip-check.outputs.skip != 'true' && steps.check-draft.outputs.is_draft == 'false'
        env:
          HEAD_REF: ${{ github.head_ref }}
          IS_FINAL: ${{ steps.check-draft.outputs.is_final_submission }}
          FINAL_TAG: ${{ steps.check-draft.outputs.final_tag }}
          DRAFT_TYPE: ${{ steps.check-draft.outputs.draft_type }}
        run: |
          BRANCH_NAME="$HEAD_REF"

          if [[ "$IS_FINAL" == "true" ]]; then
            echo "Final submission branch - merge allowed"
            echo "Branch name: $BRANCH_NAME"
            echo "Final submission tag: $FINAL_TAG"
          elif [[ "$DRAFT_TYPE" == "sync" ]]; then
            echo "Draft-to-draft sync PR - merge allowed"
            echo "Branch name: $BRANCH_NAME"
          else
            echo "Regular branch - merge allowed"
            echo "Branch name: $BRANCH_NAME"
          fi

# Reusable Security Workflow
#
# Usage:
#   jobs:
#     security:
#       uses: smkwlab/.github/.github/workflows/security.yml@v1
#       secrets: inherit
#
#   A repository with no mix.exs turns the Elixir half off and keeps the
#   secret scan:
#
#     with:
#       run-dependency-audit: false

name: Security (Reusable)

on:
  workflow_call:
    inputs:
      # These are workflow_call input defaults, which the github-actions
      # manager does not see -- it reads `uses:` references only, so left
      # unmanaged they rot. The annotations below are read by the custom
      # manager in renovate.json, which lists this file and elixir-ci.yml.
      #
      # The depNames match elixir-ci.yml's latest column deliberately: equal
      # values mean one pull request moves both files, so they cannot drift
      # apart. They already had, to 29.0.2 / 1.20.1 against 29.1 / 1.20.4.
      otp-version:
        description: 'OTP version'
        # renovate: datasource=github-releases depName=erlang/otp packageName=erlang/otp versioning=loose extractVersion=^OTP-(?<version>.*)$
        default: '29.1.1'
        required: false
        type: string
      elixir-version:
        description: 'Elixir version'
        # renovate: datasource=github-releases depName=elixir-lang/elixir packageName=elixir-lang/elixir versioning=semver extractVersion=^v(?<version>.*)$
        default: '1.20.4'
        required: false
        type: string
      dependency-audit-timeout:
        description: 'Dependency audit job timeout in minutes'
        default: 15
        required: false
        type: number
      secret-scan-timeout:
        description: 'Secret scan job timeout in minutes'
        default: 10
        required: false
        type: number
      run-dependency-audit:
        description: 'Run the Elixir dependency audit. Turn it off in a repository with no mix.exs.'
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  dependency-audit:
    # This half is Elixir-specific -- it installs a toolchain and runs mix_audit
    # over mix.lock -- while the secret scan below is not. Welded together they
    # put a repository with no mix.exs in a bind: calling this workflow fails
    # on `mix deps.get`, and not calling it gives up the secret scan too. That
    # is how a repository ends up with no secret scanning at all, and on a
    # private one that is the end of it, native scanning needing Advanced
    # Security. The default leaves every existing caller unchanged.
    if: ${{ inputs.run-dependency-audit }}
    runs-on: ubuntu-latest
    name: Dependency Security Audit
    timeout-minutes: ${{ inputs.dependency-audit-timeout }}

    steps:
    - name: Set up Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}

    - name: Restore dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Run dependency security audit
      run: |
        mix escript.install hex mix_audit --force
        export PATH="$HOME/.mix/escripts:$PATH"
        if ! mix_audit; then
          echo "❌ Vulnerable dependencies found!"
          exit 1
        else
          echo "✅ No vulnerable dependencies found"
        fi

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.secret-scan-timeout }}

    steps:
    - name: Set up Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Scan for secrets in codebase
      uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a # v3.97.6
      with:
        path: ./
        base: ${{ github.event.before || 'HEAD~1' }}
        head: HEAD
        extra_args: --debug --only-verified

# Lint Workflows
#
# Validates GitHub Actions workflow files using actionlint, and the Renovate
# preset invariants that no validator checks.
#
# Runs on every pull request rather than only on workflow changes: this is the
# repository's required status check, and a path filter would leave pull
# requests that touch only presets or docs with no check run to satisfy it.

name: Lint Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # Two invariants hold the texlive image out of auto-merge, and on their own
      # they are only sentences in a description. The rule is duplicated in
      # latex.json and renovate.json because neither configuration extends the
      # other, and the last packageRule to match is the one Renovate obeys.
      # Editing one copy, or reordering the rules, would put student-facing image
      # tags back under the bot behind a diff that looks harmless.
      # renovate-config-validator checks neither. This does.
      #
      # What is asserted is the invariant itself -- the last rule deciding
      # auto-merge for the image turns it off, and nothing that turns it on
      # follows -- not the shape it currently takes. Splitting it into several
      # rules stays legal.
      #
      # It runs in this job rather than its own so that it sits inside the
      # repository's required status check.
      - name: Check the Renovate preset invariants
        run: |
          set -euo pipefail
          image='ghcr.io/smkwlab/texlive-ja-textlint'

          rules_of() {
            jq -S -c --arg img "$image" \
              '[.packageRules[] | select(.matchPackageNames // [] | index($img)) | del(.description)]' "$1"
          }

          a=$(rules_of latex.json)
          b=$(rules_of renovate.json)
          if [ "$a" != "$b" ]; then
            echo "::error::latex.json and renovate.json disagree about ${image}. Both copies have to change together."
            printf '  latex.json    : %s\n' "$a"
            printf '  renovate.json : %s\n' "$b"
            exit 1
          fi

          # The two index sets do different jobs. $on is every rule that turns
          # auto-merge on, named or generic, and is what catches a generic rule
          # added after the image's own -- the dockerfile minor rule does not
          # name the image, so it can only be seen this way. $off is the image's
          # last word about itself, and catches the rule being flipped or
          # deleted.
          for f in latex.json renovate.json; do
            if ! jq -e --arg img "$image" '
              (.packageRules | to_entries) as $rs
              | [$rs[] | select(.value.automerge == true) | .key] as $on
              | ([$rs[] | select((.value.matchPackageNames // []) | index($img))
                       | select(.value | has("automerge")) | .key] | last) as $off
              | if $off == null then false
                elif $rs[$off].value.automerge != false then false
                elif (($on | length) > 0) and ($off < ($on | max)) then false
                else true end' "$f" >/dev/null; then
              echo "::error::${f}: the last rule deciding automerge for ${image} must set it to false, and no rule setting it true may follow."
              exit 1
            fi
          done

          echo "Renovate preset invariants hold."

      # ワークフローの本文から scripts/README.md の節へリンクしている。見出しを
      # 書き換えてもリンクは壊れず、ファイル先頭に着くだけなので、読み手は
      # それらしい場所に降りたまま何も失われたことに気付かない。この repo で
      # 「間違っても落ちない参照」はここだけなので、ここで落とす。
      - name: Check that documentation anchors resolve
        run: |
          set -euo pipefail
          status=0

          refs=$(grep -ho "blob/main/[^ )\"']*#[^ )\"']*" .github/workflows/*.yml | sort -u || true)
          # 抽出が空なのは「リンクが無い」とは限らず、書き方が変わって
          # パターンが当たらなくなっただけかもしれない。黙って通さない
          if [ -z "$refs" ]; then
            echo "::error::ワークフローから README へのリンクが 1 件も見つからない。抽出パターンが当たらなくなっている可能性がある"
            exit 1
          fi

          while IFS= read -r ref; do
            file=${ref#blob/main/}
            file=${file%%#*}
            anchor=${ref#*#}

            if [ ! -f "$file" ]; then
              echo "::error::${file} はワークフローからリンクされているが存在しない。"
              status=1
              continue
            fi

            # 見出しの文字列をそのままアンカーにしている前提。英語の複数語
            # 見出しを足すなら、GitHub の slug 規則（小文字化・空白をハイフンに）
            # に合わせてここを広げること
            if ! grep -qxF "## ${anchor}" "$file" && ! grep -qxF "### ${anchor}" "$file"; then
              echo "::error::${file} に見出し「${anchor}」が無いが、ワークフローが #${anchor} へリンクしている。"
              status=1
            fi
          done <<<"$refs"

          if [ "$status" -eq 0 ]; then
            echo "Documentation anchors resolve."
          fi
          exit "$status"

      # Two invariants about what may auto-merge, which no validator reads.
      #
      # A. custom.regex updates must not auto-merge beyond patch. What lets
      #    github-actions and mix auto-merge a minor is that CI proves it: a
      #    green pull request has exercised the thing being updated. That does
      #    not hold for the versions custom.regex manages here. They are the
      #    workflow_call input defaults of elixir-ci.yml, and this repository's
      #    pull request CI never runs a reusable workflow -- actionlint is all
      #    that runs. #189 moved OTP to 29.1 behind a green check that had
      #    verified nothing about OTP; it took running the matrix in a consumer
      #    to know. Nothing in the configuration said so, which leaves a later
      #    reader looking at a gap rather than a decision, and gaps get filled.
      #
      #    Rules with no matchManagers count, because the org-wide rule in
      #    default.json has none and widening it would reach custom.regex too.
      #    Rules with no matchUpdateTypes count for the same reason: absent
      #    means every type, so what has to be caught is the absence, not the
      #    word "minor". An earlier draft of this check missed exactly that.
      #
      # B. A's premise, asserted on its own. Should this repository's pull
      #    request CI ever run elixir-ci.yml, A stops being right -- but only
      #    if somebody notices. Failing here names A, so whoever adds the
      #    self-test has to decide about it. The alternative, exempting A
      #    automatically when a self-test exists, was rejected: reading that
      #    wrong fails towards merging an unverified toolchain, where reading
      #    this wrong only fails towards a red check.
      - name: Check the auto-merge policy invariants
        run: |
          set -euo pipefail

          for f in default.json github-actions.json renovate.json; do
            bad=$(jq -c '
              [ .packageRules[]?
                | select(.automerge == true)
                | select((.matchManagers // null) == null
                         or ((.matchManagers | index("custom.regex")) != null))
                | select((.matchUpdateTypes == null)
                         or (any(.matchUpdateTypes[]; . == "minor" or . == "major")))
                | {matchManagers, matchUpdateTypes} ]' "$f")
            if [ "$bad" != '[]' ]; then
              echo "::error::${f}: custom.regex updates must not auto-merge beyond patch. This repository's pull request CI does not run the reusable workflows, so a toolchain bump here is unverified until a consumer runs it. If that has changed, revisit this rule rather than removing the check."
              printf '  %s\n' "$bad"
              exit 1
            fi
          done

          set +e
          callers=$(grep -rlE '^[[:space:]]*uses:[[:space:]]*(\./)?\.github/workflows/elixir-ci\.yml|^[[:space:]]*uses:[[:space:]]*smkwlab/\.github/\.github/workflows/elixir-ci\.yml@' .github/workflows/)
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::could not search .github/workflows (grep exited ${rc}). That is a check which failed to run, not a check which passed."
            exit 1
          fi
          if [ -n "$callers" ]; then
            echo "::error::elixir-ci.yml is called from inside this repository now, which is the premise the rule above rests on. Re-read that rule: if pull request CI genuinely exercises the matrix, a minor auto-merge may be justified."
            printf '%s\n' "$callers" | sed 's/^/  /'
            exit 1
          fi

          echo "Auto-merge policy invariants hold."

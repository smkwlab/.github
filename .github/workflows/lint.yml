# Lint Workflows
#
# Validates GitHub Actions workflow files using actionlint.
#
# Runs on every pull request rather than only on workflow changes: this is the
# repository's required status check, and a path filter would leave pull
# requests that touch only presets or docs with no check run to satisfy it.

name: Lint Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

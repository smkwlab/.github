---
# texlive-ja-textlint のイメージタグが各リポジトリで揃っているかを週次で監査する。
#
# タグは複数のリポジトリの複数のファイルに散らばっており、ずれても何も壊れない
# （古いイメージは残るので参照は解決する）。そのため上げ忘れが誰にも気付かれない。
# 宣言は config/texlive-tag-refs.json、突き合わせは
# scripts/audit-texlive-tags.sh が行う。
#
# 是正はここからは行わない。イメージ更新は textlint のルールが変わって学生の
# lint 結果に直接効くため、人が判断して PR を出す。
name: Audit TeXLive Tags

"on":
  schedule:
    # 毎週月曜 09:30 JST（00:30 UTC）。同じ月曜に走る Audit Repo Protection と
    # 30 分ずらして、報告 Issue が同時に立たないようにする
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # secret が無いときに skip すると、何も見ていない監査が success を出し、
      # 「確認済み」と誤読される。設定漏れは黙らせずに落とす。
      - name: Check that the App credentials are configured
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::APP_ID / APP_PRIVATE_KEY が未設定。scripts/README.md の有効化手順を参照"
            exit 1
          fi

      # 対象リポジトリの clone には contents: read が要り、github.token は
      # このリポジトリにしか効かない。
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 乖離があればスクリプトは非ゼロで終わる。ここで落とさず、報告まで進む。
      - name: Audit
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          # tee にパイプしないこと。パイプラインの終了ステータスは tee のものに
          # なるため、乖離があっても常に clean=true になる。
          if bash scripts/audit-texlive-tags.sh --quiet > audit.log 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          cat audit.log

      # Issue はこのリポジトリに立てるので github.token で足りる。App に
      # issues: write を持たせない。
      - name: Report drift
        if: steps.audit.outputs.clean != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "texlive-ja-textlint のタグがリポジトリ間でずれている"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "\`config/texlive-tag-refs.json\` の source of truth と、各リポジトリが"
            echo "名乗っているタグが一致しません。"
            echo
            echo '```'
            cat audit.log
            echo '```'
            echo
            echo "イメージ更新は学生の lint 結果に直接効くため、自動では是正しません。"
            echo "上げてよいか判断したうえで、該当リポジトリに PR を出してください。"
            echo
            echo "意図的に古い版を書いている箇所であれば、宣言の \`ignore\` に加えてください。"
            echo
            echo "実行: ${RUN_URL}"
          } > report.md

          # 週次で回るので、既存の報告があれば追記する。毎週新しい Issue が
          # 積み上がると、どれが現状か分からなくなる。
          #
          # --search は全文検索なので、この文言を含む別の Issue を拾いうるし、
          # インデックスの遅れで直前に立てた Issue を見落として二重に立てうる。
          # 一覧を取って題名の完全一致で選ぶ。
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body-file report.md
          fi

      # 揃っていれば前回の報告を閉じる。報告するだけで取り下げない監視は、
      # 是正後も開いたままの Issue を残す。読む側はそれが現状を指しているか
      # 分からず、実物を確かめ直すことになる（#161 がそうなった）。
      - name: Close the report once the drift is gone
        if: steps.audit.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "texlive-ja-textlint のタグがリポジトリ間でずれている"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 題名の完全一致で選ぶ。理由は Report drift の同じ検索と同じ。
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title)
          existing=$(jq -r '.[] | select(.title == env.TITLE) | .number' <<<"$issues")

          if [ -z "$existing" ]; then
            # 上限に張り付いた状態で見つからないのは、「無い」ではなく
            # 「見えていない」かもしれない。黙って成功させると閉じ忘れが
            # 成功として通るので、そのときだけは落とす。
            if [ "$(jq 'length' <<<"$issues")" -ge 100 ]; then
              echo "::error::開いている Issue が一覧の上限に達している。報告を見落とした可能性があるため確認すること"
              exit 1
            fi
            echo "開いている報告は無い。閉じるものが無い"
            exit 0
          fi

          {
            echo "タグが揃ったことを確認したので閉じます。"
            echo
            echo '```'
            cat audit.log
            echo '```'
            echo
            echo "実行: ${RUN_URL}"
          } > resolved.md

          # 同名の報告が複数あれば全部閉じる。Report drift は先頭にしか追記
          # しないので、2 本目以降は更新されないまま開き続ける。
          while read -r number; do
            [ -n "$number" ] || continue
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file resolved.md
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
          done <<<"$existing"

      # 報告を投げてから落とす。Actions の一覧でも赤く見えるようにする。
      - name: Fail if drift was found
        if: steps.audit.outputs.clean != 'true'
        run: |
          echo "::error::タグが揃っていない。詳細は起票された Issue を参照"
          exit 1

# Probe SMTP TLS capability
#
# notify-ml-on-pr.yml hands SMTP credentials to the lab mail server. Whether
# they travel encrypted depends on two facts nobody can look up: the value of
# the SMTP_PORT secret, and whether the server advertises STARTTLS. GitHub
# never gives a secret back after it is set, so the only way to learn either
# is to measure from a runner.
#
# This workflow measures and reports a verdict. It prints no secret and no raw
# openssl output -- with -brief openssl echoes the peer certificate's CN, and
# GitHub's masking only covers exact matches of the secret string.
#
# Run it from Actions -> Probe SMTP TLS capability -> Run workflow. The job
# succeeds only when the credentials are actually protected, so the run's own
# red or green answers the question before you read the log.
# See smkwlab/.github#182.
name: Probe SMTP TLS capability

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Probe the lab SMTP server
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${SMTP_SERVER}" ] || [ -z "${SMTP_PORT}" ]; then
            echo "::error::SMTP_SERVER / SMTP_PORT are not visible from this repository."
            echo "::error::Widen the visibility of the organization secrets, or run this from a repository that already sees them."
            exit 1
          fi

          # Assert the handshake positively rather than trusting an exit code
          # alone. The captured output is read but never printed.
          tls_negotiates() {
            local out rc
            out=$(mktemp)
            timeout 30 openssl s_client "$@" -brief </dev/null >"${out}" 2>&1 && rc=0 || rc=1
            if [ "${rc}" -eq 0 ] && grep -q "CONNECTION ESTABLISHED" "${out}"; then
              rm -f "${out}"
              return 0
            fi
            rm -f "${out}"
            return 1
          }

          case "${SMTP_PORT}" in
            465) echo "port      : 465 (implicit TLS) -- the action defaults 'secure' to true" ;;
            587) echo "port      : 587 (submission) -- the action defaults 'secure' to false" ;;
            25)  echo "port      : 25 (smtp) -- the action defaults 'secure' to false" ;;
            *)   echo "port      : none of 465, 587 or 25 -- the action defaults 'secure' to false" ;;
          esac

          # bash's own /dev/tcp, so the probe depends on no netcat flavour.
          if timeout 15 bash -c 'exec 3<>/dev/tcp/"$0"/"$1"' "${SMTP_SERVER}" "${SMTP_PORT}" 2>/dev/null; then
            echo "reachable : yes"
          else
            echo "reachable : no -- the runner cannot open a TCP connection"
            echo "::error::Unreachable from a GitHub runner means notify-ml-on-pr is not delivering mail either."
            exit 1
          fi

          if [ "${SMTP_PORT}" = "465" ]; then
            if tls_negotiates -connect "${SMTP_SERVER}:${SMTP_PORT}"; then
              echo "tls       : yes -- encrypted from the first byte"
              echo "verdict   : credentials are already protected. require_tls would be inert; nothing to change."
            else
              echo "tls       : no -- the port is open but TLS did not negotiate"
              echo "::error::Port 465 with no working TLS. Investigate the server before changing the workflow."
              exit 1
            fi
          else
            if tls_negotiates -starttls smtp -connect "${SMTP_SERVER}:${SMTP_PORT}"; then
              echo "starttls  : yes -- advertised, and the handshake completes"
              echo "verdict   : credentials are encrypted today, but only opportunistically. Setting require_tls: true makes it mandatory and changes nothing else."
            else
              echo "starttls  : no -- not advertised, or the handshake failed"
              echo "::error::Credentials are being sent in clear text today."
              echo "verdict   : require_tls: true would stop the notifications rather than fix this. Fix the transport first -- STARTTLS on the server, or implicit TLS on 465."
              exit 1
            fi
          fi
